services:
  db:
    image: postgres:16
    container_name: ctd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicaltrials
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicaltrials"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
